<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SATAPON CENTER</title>

    <!-- App Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="https://res.cloudinary.com/dzjxevid7/image/upload/v1776492664/Gemini_Generated_Image_mzaktwmzaktwmzak-1_1_el4wqy.png">
    <link rel="apple-touch-icon" href="https://res.cloudinary.com/dzjxevid7/image/upload/v1776492664/Gemini_Generated_Image_mzaktwmzaktwmzak-1_1_el4wqy.png">

    <!-- Mobile Web App Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="STP-CENTER">
    <meta name="theme-color" content="#aa8b2c">

    <!-- Manifest -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"SATAPON CENTER","short_name":"STP-CENTER","start_url":".","display":"standalone","background_color":"#ffffff","theme_color":"#aa8b2c","icons":[{"src":"https://res.cloudinary.com/dzjxevid7/image/upload/v1776492664/Gemini_Generated_Image_mzaktwmzaktwmzak-1_1_el4wqy.png","sizes":"192x192","type":"image/png"}]}' >

    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #fcfcf9;
            font-family: 'Prompt', sans-serif;
        }

        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fcfcf9;
            color: #aa8b2c;
            z-index: 9999;
            transition: opacity 0.4s ease;
        }

        .loader-wrapper { text-align: center; }

        .spinner {
            width: 42px;
            height: 42px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #aa8b2c;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="loader-wrapper">
            <div class="spinner"></div>
            <p style="font-size: 14px; font-weight: 500;">กำลังเข้าสู่ระบบ SATAPON CENTER...</p>
        </div>
    </div>

    <!-- กำหนดสิทธิ์ให้ครอบคลุมทุก origin และรวม sandbox ไว้เพื่อปลดล็อกระบบ -->
    <iframe 
        id="appFrame" 
        src="https://script.google.com/macros/s/AKfycbxbfeQdBJcl3LDSUD4y19xWRX_8PRXspEFwz4QKdasXtrz4-A8CaxfOc9Fm1Gl49y7yXQ/exec" 
        allow="geolocation *; camera *; microphone *;"
        sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts allow-top-navigation"
        onload="hideLoader()">
    </iframe>

    <script>
        // กระตุ้นการขอสิทธิ์ GPS ที่ระดับตัวแม่ (GitHub) ทันทีที่เปิดเว็บ
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function() {}, function() {}, { enableHighAccuracy: true });
        }

        function hideLoader() {
            var loader = document.getElementById('loader');
            if (loader) {
                loader.style.opacity = '0';
                setTimeout(function() {
                    loader.style.display = 'none';
                }, 400);
            }
        }
    </script>
</body>
</html>
